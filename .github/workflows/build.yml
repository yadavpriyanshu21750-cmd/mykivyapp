name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Setup Virtualenv & Buildozer
        run: |
          python -m venv .buildozer_venv
          source .buildozer_venv/bin/activate
          pip install --upgrade pip wheel setuptools
          pip install "cython<3.0" buildozer

      - name: Run Buildozer using GitHub Runner Android SDK
        run: |
          source .buildozer_venv/bin/activate
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_NDK_LATEST_HOME"
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
          
